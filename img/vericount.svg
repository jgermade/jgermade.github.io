<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">vericount</title>
  <!-- An abacus whose beads are chained blocks; the chain draws a check mark. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a7fe6"/>
      <stop offset="1" stop-color="#1557ad"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#frame)"/>
  <!-- Rods -->
  <g stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <line x1="9" y1="18" x2="55" y2="18"/>
    <line x1="9" y1="32" x2="55" y2="32"/>
    <line x1="9" y1="46" x2="55" y2="46"/>
  </g>
  <!-- Beads still to count -->
  <g fill="#fff" fill-opacity=".45">
    <circle cx="13" cy="18" r="3.5"/>
    <circle cx="21" cy="18" r="3.5"/>
    <circle cx="45" cy="32" r="3.5"/>
    <circle cx="52" cy="32" r="3.5"/>
    <circle cx="51" cy="46" r="3.5"/>
  </g>
  <!-- The chain: a check mark through three blocks -->
  <polyline points="14,32 27,46 49,18" fill="none" stroke="#fff" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff">
    <rect x="9" y="27" width="10" height="10" rx="2.5"/>
    <rect x="22" y="41" width="10" height="10" rx="2.5"/>
    <rect x="44" y="13" width="10" height="10" rx="2.5"/>
  </g>
  <!-- Each block holds the hash of the one before; the one at the
       vertex of the chain is the verified one -->
  <g fill="#1557ad">
    <rect x="11.5" y="31.2" width="5" height="1.6" rx=".8"/>
    <rect x="46.5" y="17.2" width="5" height="1.6" rx=".8"/>
  </g>
  <polyline points="24.4,46.1 26.4,48.1 29.7,44" fill="none" stroke="#1557ad" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
