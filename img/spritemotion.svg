<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bgGlow192" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14233c" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
  </defs>

  <rect width="192" height="192" rx="40" fill="url(#bgGlow192)" />
  <rect x="5" y="5" width="182" height="182" rx="36" fill="none" stroke="#223652" stroke-width="3" />

  <!-- Dotted Motion Path & Diamonds -->
  <g transform="translate(96, 96) rotate(45)">
    <rect x="-16" y="-16" width="32" height="32" fill="#1f2d48" stroke="#fbf236" stroke-width="3" />
    <rect x="-8" y="-8" width="16" height="16" fill="#df7126" />
  </g>

  <!-- Cyan Ghost Frame -->
  <g transform="translate(68, 38)" opacity="0.6">
    <rect x="14" y="2" width="14" height="14" fill="#5fcde4" />
    <rect x="10" y="16" width="16" height="20" fill="#306082" />
    <rect x="0" y="18" width="10" height="8" fill="#5fcde4" />
  </g>

  <!-- Main Hero Sprite in Motion -->
  <g transform="translate(86, 26)">
    <!-- Helmet & Crest -->
    <rect x="14" y="-4" width="8" height="8" fill="#fbf236" />
    <rect x="10" y="4" width="18" height="16" fill="#0284c7" />
    <rect x="16" y="8" width="10" height="8" fill="#ead4aa" />
    <rect x="22" y="10" width="3" height="4" fill="#000000" />
    <rect x="8" y="10" width="4" height="4" fill="#fbf236" />

    <!-- Torso -->
    <rect x="8" y="20" width="18" height="22" fill="#0284c7" />
    <rect x="12" y="22" width="12" height="10" fill="#38bdf8" />
    <rect x="14" y="25" width="8" height="4" fill="#df7126" />

    <!-- Joint Pivots & Arm -->
    <circle cx="28" cy="24" r="3.5" fill="#fbf236" />
    <rect x="30" y="22" width="14" height="5" fill="#df7126" />
    <circle cx="45" cy="24" r="3" fill="#fbf236" />
    <rect x="47" y="20" width="7" height="8" fill="#38bdf8" />

    <!-- Legs & Joints -->
    <circle cx="20" cy="42" r="3.5" fill="#fbf236" />
    <rect x="22" y="44" width="7" height="14" fill="#38bdf8" />
    <circle cx="26" cy="60" r="3.5" fill="#fbf236" />
    <rect x="24" y="62" width="7" height="14" fill="#df7126" />
    <rect x="25" y="76" width="12" height="6" fill="#0284c7" />

    <circle cx="10" cy="42" r="3.5" fill="#fbf236" />
    <rect x="2" y="46" width="7" height="12" fill="#082f49" transform="rotate(35 6 48)" />
    <circle cx="2" cy="60" r="3" fill="#fbf236" />
    <rect x="-8" y="65" width="7" height="14" fill="#082f49" transform="rotate(40 0 65)" />
  </g>

  <!-- Bottom Badge: SM -->
  <g transform="translate(68, 150)">
    <rect x="0" y="0" width="56" height="20" rx="4" fill="#0b1524" stroke="#1d3049" stroke-width="2" />
    <text x="28" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      SM
    </text>
  </g>
</svg>
